[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flits-video"
version = "0.4.0"
description = "Python wrapper for the flits video renderer: build scenes as dicts, render them with the flits CLI"
readme = { text = "Render flits scenes (JSON video descriptions) from Python. Needs the `flits` CLI on PATH or $FLITS_BIN. See https://github.com/ArjandenHartog/flits", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["typing_extensions>=4.0; python_version < '3.11'"]
keywords = ["video", "rendering", "flits", "transcription", "captions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ArjandenHartog/flits"

[tool.setuptools]
packages = ["flits"]

[tool.setuptools.package-data]
flits = ["py.typed"]
