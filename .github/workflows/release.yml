name: release
# Tag a version (`git tag v0.2.0 && git push origin v0.2.0`) to build the binaries, publish a GitHub
# release with them and publish the crate (CARGO_REGISTRY_TOKEN), the TypeScript package to npm (NPM_TOKEN)
# and the Python package to PyPI (PYPI_API_TOKEN), each when its secret is set.
# Run it by hand (workflow_dispatch) to only build the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the binary then runs on glibc 2.35 and newer (Ubuntu 22.04+, Debian 12+)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="$(git rev-parse --short HEAD)"
          name="flits-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md SPEC.md LICENSE "$name/"
          cp -r schema "$name/"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            cp "target/${{ matrix.target }}/release/flits.exe" "$name/"
            7z a -bd "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/flits" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          "$name/flits$([[ "${{ matrix.archive }}" == zip ]] && echo .exe)" --version
          echo "ARCHIVE=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: flits-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "flits $GITHUB_REF_NAME" --generate-notes --verify-tag

  crates-io:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
      - name: no token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"

  npm:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: version matches the tag
        run: test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
      - name: npm publish
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance
      - name: no token
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; skipping npm"

  pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        working-directory: bindings/python
        run: |
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}"
          python -m pip install build
          python -m build
      - name: PyPI publish
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: no token
        if: env.PYPI_API_TOKEN == ''
        run: echo "::notice::PYPI_API_TOKEN is not set; skipping PyPI"
