name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Command, error message and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Scene or steps to reproduce
      render: json
  - type: textarea
    attributes:
      label: Output of `flits doctor`
      render: text
    validations:
      required: true
