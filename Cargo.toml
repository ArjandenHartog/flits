[package]
name = "flits"
version = "0.1.0"
edition = "2021"
description = "Blazing-fast GPU video and podcast renderer (JSON scene -> MP4) with built-in transcription"
license = "MIT"
authors = ["Arjan den Hartog", "flits contributors"]
repository = "https://github.com/ArjandenHartog/flits"
readme = "README.md"
keywords = ["video", "rendering", "gpu", "podcast", "transcription"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities", "rendering"]
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fast_image_resize = "5"
rayon = "1"
rustfft = "6"
wgpu = "25"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
tiny_http = "0.12"
ureq = "2"
tar = "0.4"
serde_ignored = "0.1.14"
resvg = "0.45"
schemars = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

# quick iteration builds: `cargo build --profile fast`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
