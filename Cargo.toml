[package]
name = "flits"
version = "0.1.0"
edition = "2021"
description = "Bliksemsnelle video- en podcastrenderer met ingebouwde transcriptie"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fast_image_resize = "5"
rayon = "1"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
